name: Bug
description: Something is broken
title: "<what's broken>"
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. 
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device / viewport
      multiple: true
      options:
        ["Phone (375 px)", "Tablet (768 px)", "Desktop (1280 px+)", "iOS Safari", "Android Chrome"]
  - type: input
    id: url
    attributes:
      label: URL (production or preview)
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, console errors
